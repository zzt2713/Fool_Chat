syntax = "proto3";

package message;

service VarifyService {
	rpc GetVarifyCode (GetVarifyReq) returns (GetVarifyRsp) {}
}

message GetVarifyReq {
	string email = 1;
	string username = 2; 
}

message GetVarifyRsp {
	int32 error = 1;
	string email = 2;
	string code = 3;
}

message GetChatServerReq {
	int32 uid = 1;
}

message GetChatServerRsp {
	int32 error = 1;
	string host = 2;
	string port = 3;
	string token = 4;
}

message LoginReq{
	int32 uid = 1;
	string token= 2;
}

message LoginRsp {
	int32 error = 1;
	int32 uid = 2;
	string token = 3;
}

service StatusService {
	rpc GetChatServer (GetChatServerReq) returns (GetChatServerRsp) {}
	rpc Login(LoginReq) returns(LoginRsp);
}

message AddFriendReq {
	int32  applyuid = 1;
	string name = 2;
	string desc = 3;
	string icon = 4;
	string nick = 5;
	int32  sex = 6;
	int32  touid = 7;
}

message AddFriendRsp {
	int32 error = 1;
	int32 applyuid = 2;
	int32 touid = 3;
}

message RplyFriendReq {
	int32 rplyuid = 1;
	bool  agree = 2;
	int32 touid = 3;
}

message RplyFriendRsp {
	int32 error = 1;
	int32 rplyuid = 2;
	int32 touid = 3;
}

message SendChatMsgReq{
		int32 fromuid = 1;
		int32 touid = 2;
		string message = 3;
}

message SendChatMsgRsp{
		int32 error = 1;
		int32 fromuid = 2;
		int32 touid = 3;
}

message AuthFriendReq{
	int32 fromuid = 1;
	int32 touid = 2;
}

message AuthFriendRsp{
	int32 error = 1;
	int32 fromuid = 2;
	int32 touid = 3;
}

message TextChatMsgReq {
	int32 fromuid = 1;
    int32 touid = 2;
	repeated TextChatData textmsgs = 3;
}

message TextChatData{
	string msgid = 1;
	string msgcontent = 2;
}

message TextChatMsgRsp {
	int32 error = 1;
	int32 fromuid = 2;
	int32 touid = 3; 
	repeated TextChatData textmsgs = 4;
}

message KickUserReq{
	int32 uid = 1;
}

message KickUserRsp{
	int32 error = 1;
	int32 uid = 2;
}

message DeleteFriendReq{
	int32 uid = 1;
	int32 touid = 2;
}

message DeleteFriendRsp{
	int32 error = 1;
	int32 touid = 2;
}

message FriendStatusReq{
	int32 uid = 1;
	int32 status = 2;
	int32 touid = 3;
}

message FriendStatusRsp{
	int32 error = 1;
}

message CallSigMsg {
	int32 fromuid = 1;   // 信令发送方 uid
	int32 touid = 2;     // 信令接收方 uid
	string call_id = 3;  // 一次通话的唯一标识，由主叫生成
	string sig_type = 4; // 信令类型：invite/accept/reject/offer/answer/ice/hangup
	string payload = 5;  // 载荷：SDP 文本或 ICE 候选 JSON，控制类信令为空
}

message CallSigRsp {
	int32 error = 1;
	int32 fromuid = 2;
	int32 touid = 3;
}

service ChatService {
	rpc NotifyAddFriend(AddFriendReq) returns (AddFriendRsp) {}
	rpc NotifyDeleteFriend(DeleteFriendReq) returns (DeleteFriendRsp) {}
	rpc RplyAddFriend(RplyFriendReq) returns (RplyFriendRsp) {}
	rpc SendChatMsg(SendChatMsgReq) returns (SendChatMsgRsp) {}
	rpc NotifyAuthFriend(AuthFriendReq) returns (AuthFriendRsp) {}
	rpc NotifyTextChatMsg(TextChatMsgReq) returns (TextChatMsgRsp){}
	rpc NotifyKickUser(KickUserReq) returns (KickUserRsp){}
	rpc NotifyFriendStatus(FriendStatusReq) returns (FriendStatusRsp){}
	rpc NotifyCallMsg(CallSigMsg) returns (CallSigRsp){}
}
